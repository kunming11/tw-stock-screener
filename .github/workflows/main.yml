name: Taiwan Strong Stock Screener

on:
  schedule:
    # 台灣時間週一至週五 15:30 = UTC 07:30
    - cron: "30 7 * * 1-5"
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write

jobs:
  screen-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 盤後 15:30 法人報表偶發尚未上架，先稍候再抓
      - name: Wait for TWSE after-hours data
        run: sleep 90

      - name: Run screener
        run: python screener.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data.json; then
            echo "data.json 無變更，略過 commit"
            exit 0
          fi

          git add data.json
          git commit -m "chore: update after-hours screener data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
